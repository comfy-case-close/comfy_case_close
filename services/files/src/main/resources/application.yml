spring:
  application:
    name: files-service
  datasource:
    url: jdbc:postgresql://localhost:6432/fnbx_oltp
    username: svc_files
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.fnbx.shared.hibernate.FnbxPostgreSQLDialect
server:
  port: 8083
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui
app:
  storage:
    enabled: ${GCS_ENABLED:false}
    bucket-name: ${GCS_BUCKET_NAME:}
    service-account-key-path: ${GCS_SERVICE_ACCOUNT_KEY:}
    object-prefix: ${GCS_OBJECT_PREFIX:case-close}
    signed-url-ttl-minutes: ${GCS_SIGNED_URL_TTL_MINUTES:60}
    max-file-size-bytes: ${GCS_MAX_FILE_SIZE_BYTES:10485760}
