spring:
  application:
    name: files-service
  datasource:
    url: jdbc:postgresql://localhost:6432/fnbx_oltp
    username: svc_files
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.fnbx.shared.hibernate.FnbxPostgreSQLDialect
server:
  port: ${PORT:8083}
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui
app:
  storage:
    enabled: ${GCS_ENABLED:true}
    bucket-name: ${GCS_BUCKET_NAME:comfy-uploads}
    service-account-key-path: ${GCS_SERVICE_ACCOUNT_KEY:/Volumes/SandiskSSD/Developer/Comfy/comfy_case_close/services/files/local-secrets/comfy-506206-1eb538c99f80.json}
    object-prefix: ${GCS_OBJECT_PREFIX:case-close}
    signed-url-ttl-minutes: ${GCS_SIGNED_URL_TTL_MINUTES:60}
    max-file-size-bytes: ${GCS_MAX_FILE_SIZE_BYTES:10485760}

logging:
  config: classpath:fnbx-logback-spring.xml
  file:
    name: ${FNB_LOG_DIR:./logs}/${spring.application.name}/application.log
  logback:
    rollingpolicy:
      file-name-pattern: ${FNB_LOG_DIR:./logs}/${spring.application.name}/archive/application.%d{yyyy-MM-dd,Asia/Ho_Chi_Minh}.%i.log.gz
      max-file-size: ${FNB_LOG_MAX_FILE_SIZE:100MB}
      max-history: ${FNB_LOG_MAX_HISTORY:30}
      total-size-cap: ${FNB_LOG_TOTAL_SIZE_CAP:2GB}
      clean-history-on-start: true
  pattern:
    level: "%5p [${spring.application.name} requestId=%X{requestId:-none}]"
  level:
    com.fnbx: INFO
    com.fnbx.files: DEBUG
    com.fnbx.shared.logging.HttpPayloadLogger: DEBUG
