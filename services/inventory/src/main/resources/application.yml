spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:6432/fnbx_oltp
    username: svc_inventory
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.fnbx.shared.hibernate.FnbxPostgreSQLDialect
server:
  port: ${PORT:8088}
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui

logging:
  config: classpath:fnbx-logback-spring.xml
  file:
    name: ${FNB_LOG_DIR:./logs}/${spring.application.name}/application.log
  logback:
    rollingpolicy:
      file-name-pattern: ${FNB_LOG_DIR:./logs}/${spring.application.name}/archive/application.%d{yyyy-MM-dd,Asia/Ho_Chi_Minh}.%i.log.gz
      max-file-size: ${FNB_LOG_MAX_FILE_SIZE:100MB}
      max-history: ${FNB_LOG_MAX_HISTORY:30}
      total-size-cap: ${FNB_LOG_TOTAL_SIZE_CAP:2GB}
      clean-history-on-start: true
  pattern:
    level: "%5p [${spring.application.name} requestId=%X{requestId:-none}]"
  level:
    com.fnbx: INFO
    com.fnbx.inventory: DEBUG
    com.fnbx.shared.logging.HttpPayloadLogger: DEBUG
