spring:
  application:
    name: cashclose-service

  datasource:
    # ⚠️ Ket noi qua PGBOUNCER (6432), khong phai Postgres truc tiep (5433).
    #    Day la ly do TenantAwareDataSource PHAI dung set_config(..., true).
    url: jdbc:postgresql://localhost:6432/fnbx_oltp
    username: svc_cashclose
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      # PgBouncer transaction pooling khong ho tro prepared statement phia server
      data-source-properties:
        prepareThreshold: 0

  jpa:
    open-in-view: false          # tranh N+1 an va giu transaction ngan
    hibernate:
      ddl-auto: validate         # SCHEMA DO db/ QUAN LY. Hibernate KHONG duoc tao bang.
    properties:
      hibernate:
        dialect: com.fnbx.shared.hibernate.FnbxPostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        # KHONG dat default_schema: entity da khai bao schema tuong minh

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8086

springdoc:
  api-docs.path: /api-docs       # fnbx-frontend sinh api-client tu day
  swagger-ui.path: /swagger-ui

logging:
  level:
    com.fnbx: INFO

fnb:
  mail:
    from: ${MAIL_FROM:}
    enabled: ${MAIL_ENABLED:true}
    provider: ${MAIL_PROVIDER:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    cash-close-review-path-template: ${CASH_CLOSE_REVIEW_PATH_TEMPLATE:/approvals?cashCloseId={id}}
    cash-close-submitter-path-template: ${CASH_CLOSE_SUBMITTER_PATH_TEMPLATE:/history?cashCloseId={id}}
