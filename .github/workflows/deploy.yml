name: Deploy

# Each service is an independently deployable unit — ADR-0003 decision #13.
# Only services whose source changed are rebuilt and redeployed.
# Migration ALWAYS runs before any service deploy — ADR-0003 decision #7.
on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db:          ${{ steps.filter.outputs.db }}
      identity:    ${{ steps.filter.outputs.identity }}
      platform:    ${{ steps.filter.outputs.platform }}
      files:       ${{ steps.filter.outputs.files }}
      notify:      ${{ steps.filter.outputs.notify }}
      integration: ${{ steps.filter.outputs.integration }}
      cashclose:   ${{ steps.filter.outputs.cashclose }}
      workforce:   ${{ steps.filter.outputs.workforce }}
      inventory:   ${{ steps.filter.outputs.inventory }}
      reporting:   ${{ steps.filter.outputs.reporting }}
      gateway:     ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: &core
              - 'pom.xml'
              - 'fnbx-bom/**'
              - 'libs/fnbx-shared/**'
            db:
              - 'db/**'
            identity:
              - *core
              - 'services/identity/**'
              - 'libs/fnbx-entities-identity/**'
              - 'libs/fnbx-entities-platform/**'
            platform:
              - *core
              - 'services/platform/**'
              - 'libs/fnbx-entities-platform/**'
              - 'libs/fnbx-entities-identity/**'
            files:
              - *core
              - 'services/files/**'
              - 'libs/fnbx-entities-files/**'
              - 'libs/fnbx-entities-identity/**'
            notify:
              - *core
              - 'services/notify/**'
              - 'libs/fnbx-entities-notify/**'
              - 'libs/fnbx-entities-identity/**'
            integration:
              - *core
              - 'services/integration/**'
              - 'libs/fnbx-entities-integration/**'
              - 'libs/fnbx-entities-identity/**'
            cashclose:
              - *core
              - 'services/cashclose/**'
              - 'libs/fnbx-entities-cashclose/**'
              - 'libs/fnbx-entities-identity/**'
              - 'libs/fnbx-entities-platform/**'
              - 'libs/fnbx-entities-files/**'
              - 'libs/fnbx-entities-integration/**'
            workforce:
              - *core
              - 'services/workforce/**'
              - 'libs/fnbx-entities-workforce/**'
              - 'libs/fnbx-entities-identity/**'
            inventory:
              - *core
              - 'services/inventory/**'
              - 'libs/fnbx-entities-inventory/**'
              - 'libs/fnbx-entities-identity/**'
            reporting:
              - *core
              - 'services/reporting/**'
              - 'libs/**'
            gateway:
              - *core
              - 'services/api-gateway/**'

  # --------------------------------------------------------------------------
  # Migration runs first — always, unconditionally when db/ changes.
  # Uses the pinned Liquibase image from db/Dockerfile against Neon directly.
  # --------------------------------------------------------------------------
  migrate:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build migration image
        run: docker build -t fnbx-migrate ./db

      - name: Run Liquibase migration against Neon
        run: |
          docker run --rm \
            -e LIQUIBASE_COMMAND_URL="${{ secrets.NEON_DIRECT_URL }}" \
            -e LIQUIBASE_COMMAND_USERNAME="${{ secrets.PG_MIGRATION_USER }}" \
            -e LIQUIBASE_COMMAND_PASSWORD="${{ secrets.PG_MIGRATION_PASSWORD }}" \
            fnbx-migrate

  # --------------------------------------------------------------------------
  # Deploy each changed service to the EC2 instance via SSH.
  # Skips services whose source did not change.
  # Waits for migration to succeed (or be skipped) before running.
  # --------------------------------------------------------------------------
  deploy:
    needs: [changes, migrate]
    if: always() && needs.migrate.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { svc: identity,    changed: identity    }
          - { svc: platform,    changed: platform    }
          - { svc: files,       changed: files       }
          - { svc: notify,      changed: notify      }
          - { svc: integration, changed: integration }
          - { svc: cashclose,   changed: cashclose   }
          - { svc: workforce,   changed: workforce   }
          - { svc: inventory,   changed: inventory   }
          - { svc: reporting,   changed: reporting   }
          - { svc: api-gateway, changed: gateway     }
    steps:
      - uses: actions/checkout@v4

      - name: Skip if unchanged
        id: gate
        run: |
          if [ "${{ needs.changes.outputs[matrix.changed] }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ matrix.svc }}
        if: steps.gate.outputs.skip != 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: bash tools/deploy.sh ${{ matrix.svc }} ${{ github.sha }}
