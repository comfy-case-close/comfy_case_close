# Production deployment — single EC2 instance.
#
# All services share one Docker bridge network (fnbx-prod).
# Only api-gateway exposes a port to the host.
# Services reference each other by Docker service name (e.g. http://identity:8081).
#
# Before starting:
#   cp .env.aws.example .env.aws
#   # Fill in every value in .env.aws
#   docker compose -f docker-compose.aws.yml build
#   docker compose -f docker-compose.aws.yml up -d
#
# Migration must run before starting services — see docs/aws-ec2.md.

name: fnbx-prod

x-logging-environment: &logging-environment
  FNB_LOG_DIR: /logs
  FNB_LOG_MAX_FILE_SIZE: ${FNB_LOG_MAX_FILE_SIZE:-100MB}
  FNB_LOG_MAX_HISTORY: ${FNB_LOG_MAX_HISTORY:-30}
  FNB_LOG_TOTAL_SIZE_CAP: ${FNB_LOG_TOTAL_SIZE_CAP:-2GB}
  LOGGING_LEVEL_COM_FNBX: ${FNB_LOG_LEVEL:-INFO}
  FNB_LOGGING_PAYLOAD_ENABLED: ${FNB_LOG_PAYLOAD_ENABLED:-true}
  FNB_LOGGING_PAYLOAD_MAXREQUESTCHARS: ${FNB_LOG_PAYLOAD_MAX_REQUEST_CHARS:-16384}
  FNB_LOGGING_PAYLOAD_MAXRESPONSECHARS: ${FNB_LOG_PAYLOAD_MAX_RESPONSE_CHARS:-16384}
  FNB_LOGGING_PAYLOAD_FULLRESPONSE: ${FNB_LOG_PAYLOAD_FULL_RESPONSE:-false}

x-console-logging: &console-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ---------------------------------------------------------------------------
  # identity :8081 — auth, users, staff, JWT issuance
  # ---------------------------------------------------------------------------
  identity:
    build:
      context: .
      args:
        SERVICE_MODULE: identity
    image: fnbx/identity:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [fnbx-prod]
    mem_limit: 400m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/identity-service:/logs/identity-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8081"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_identity
      SPRING_DATASOURCE_PASSWORD: ${SVC_IDENTITY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}

  # ---------------------------------------------------------------------------
  # platform :8082 — config, audit, movement_kind catalogue (SCD-2)
  # ---------------------------------------------------------------------------
  platform:
    build:
      context: .
      args:
        SERVICE_MODULE: platform
    image: fnbx/platform:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [fnbx-prod]
    mem_limit: 320m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/platform-service:/logs/platform-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8082"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_platform
      SPRING_DATASOURCE_PASSWORD: ${SVC_PLATFORM_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  # ---------------------------------------------------------------------------
  # files :8083 — file metadata; GCS for object storage
  # ---------------------------------------------------------------------------
  files:
    build:
      context: .
      args:
        SERVICE_MODULE: files
    image: fnbx/files:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [fnbx-prod]
    mem_limit: 320m
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8083"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_files
      SPRING_DATASOURCE_PASSWORD: ${SVC_FILES_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GCS_ENABLED: ${GCS_ENABLED:-false}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_SERVICE_ACCOUNT_KEY: ${GCS_SERVICE_ACCOUNT_KEY:-/secrets/gcs-key.json}
      GCS_OBJECT_PREFIX: ${GCS_OBJECT_PREFIX:-case-close}
      GCS_SIGNED_URL_TTL_MINUTES: ${GCS_SIGNED_URL_TTL_MINUTES:-60}
      GCS_MAX_FILE_SIZE_BYTES: ${GCS_MAX_FILE_SIZE_BYTES:-10485760}
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/files-service:/logs/files-service
      # Mount the GCS service-account key only when GCS_ENABLED=true.
      # Create /opt/fnbx/secrets/ on the EC2 host and place the key there.
      - ${GCS_KEY_HOST_PATH:-/opt/fnbx/secrets}:/secrets:ro

  # ---------------------------------------------------------------------------
  # notify :8084 — disabled temporarily
  # ---------------------------------------------------------------------------
  notify:
    build:
      context: .
      args:
        SERVICE_MODULE: notify
    image: fnbx/notify:${IMAGE_TAG:-latest}
    restart: "no"
    networks: [fnbx-prod]
    mem_limit: 256m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/notify-service:/logs/notify-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8084"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_notify
      SPRING_DATASOURCE_PASSWORD: ${SVC_NOTIFY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  # ---------------------------------------------------------------------------
  # integration :8085 — disabled temporarily
  # ---------------------------------------------------------------------------
  integration:
    build:
      context: .
      args:
        SERVICE_MODULE: integration
    image: fnbx/integration:${IMAGE_TAG:-latest}
    restart: "no"
    networks: [fnbx-prod]
    mem_limit: 256m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/integration-service:/logs/integration-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8085"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_integration
      SPRING_DATASOURCE_PASSWORD: ${SVC_INTEGRATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  # ---------------------------------------------------------------------------
  # cashclose :8086 — cash-close management (reference service)
  # ---------------------------------------------------------------------------
  cashclose:
    build:
      context: .
      args:
        SERVICE_MODULE: cashclose
    image: fnbx/cashclose:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [fnbx-prod]
    mem_limit: 400m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/cashclose-service:/logs/cashclose-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8086"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_cashclose
      SPRING_DATASOURCE_PASSWORD: ${SVC_CASHCLOSE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      CASH_CLOSE_REVIEW_PATH_TEMPLATE: ${CASH_CLOSE_REVIEW_PATH_TEMPLATE:-/approvals?cashCloseId={id}}
      CASH_CLOSE_SUBMITTER_PATH_TEMPLATE: ${CASH_CLOSE_SUBMITTER_PATH_TEMPLATE:-/history?cashCloseId={id}}

  # ---------------------------------------------------------------------------
  # workforce :8087 — disabled temporarily
  # ---------------------------------------------------------------------------
  workforce:
    build:
      context: .
      args:
        SERVICE_MODULE: workforce
    image: fnbx/workforce:${IMAGE_TAG:-latest}
    restart: "no"
    networks: [fnbx-prod]
    mem_limit: 256m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/workforce-service:/logs/workforce-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8087"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_workforce
      SPRING_DATASOURCE_PASSWORD: ${SVC_WORKFORCE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  # ---------------------------------------------------------------------------
  # inventory :8088 — disabled temporarily
  # ---------------------------------------------------------------------------
  inventory:
    build:
      context: .
      args:
        SERVICE_MODULE: inventory
    image: fnbx/inventory:${IMAGE_TAG:-latest}
    restart: "no"
    networks: [fnbx-prod]
    mem_limit: 256m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/inventory-service:/logs/inventory-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8088"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_inventory
      SPRING_DATASOURCE_PASSWORD: ${SVC_INVENTORY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  # ---------------------------------------------------------------------------
  # reporting :8089 — disabled temporarily (svc_reporting not yet in Neon)
  # ---------------------------------------------------------------------------
  reporting:
    build:
      context: .
      args:
        SERVICE_MODULE: reporting
    image: fnbx/reporting:${IMAGE_TAG:-latest}
    restart: "no"
    networks: [fnbx-prod]
    mem_limit: 256m
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/reporting-service:/logs/reporting-service
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8089"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_reporting
      SPRING_DATASOURCE_PASSWORD: ${SVC_REPORTING_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  # ---------------------------------------------------------------------------
  # hrm :8090 — payroll, staff records, payslip emails
  # ---------------------------------------------------------------------------
  hrm:
    build:
      context: .
      args:
        SERVICE_MODULE: hrm
    image: fnbx/hrm:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [fnbx-prod]
    mem_limit: 512m
    environment:
      PORT: "8090"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: ${NEON_POOLER_URL}
      SPRING_DATASOURCE_USERNAME: svc_hrm
      SPRING_DATASOURCE_PASSWORD: ${SVC_HRM_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PAYSLIP_CONFIRM_URL: ${PAYSLIP_CONFIRM_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}

  # ---------------------------------------------------------------------------
  # api-gateway :8080 — the only service with a public port
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      args:
        SERVICE_MODULE: api-gateway
    image: fnbx/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [fnbx-prod]
    mem_limit: 320m
    ports:
      - "8080:8080"
    volumes:
      - ${FNB_LOG_HOST_DIR:-/var/log/fnbx}/api-gateway:/logs/api-gateway
    logging: *console-logging
    environment:
      <<: *logging-environment
      PORT: "8080"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SVC_IDENTITY_URI: http://identity:8081
      SVC_PLATFORM_URI: http://platform:8082
      SVC_FILES_URI: http://files:8083
      SVC_NOTIFY_URI: http://notify:8084
      SVC_INTEGRATION_URI: http://integration:8085
      SVC_CASHCLOSE_URI: http://cashclose:8086
      SVC_WORKFORCE_URI: http://workforce:8087
      SVC_INVENTORY_URI: http://inventory:8088
      SVC_REPORTING_URI: http://reporting:8089
      SVC_HRM_URI: http://hrm:8090
    depends_on:
      - identity
      - platform
      - files
      - cashclose

networks:
  fnbx-prod:
    driver: bridge
