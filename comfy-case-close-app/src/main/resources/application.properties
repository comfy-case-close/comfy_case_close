spring.application.name=comfy-case-close
# ============================================================================
# Datasource  --  fill these in later (or override via env vars before running)
# Defaults point at a local Postgres named 'comfy_cash_close'.
# ============================================================================
spring.datasource.url=jdbc:postgresql://localhost:6666/comfy_db?currentSchema=cash_close_final
spring.jpa.properties.hibernate.default_schema=cash_close_final
spring.liquibase.default-schema=cash_close_final
spring.liquibase.liquibase-schema=public
spring.datasource.username=comfy_db
spring.datasource.password=comfy_db
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# spring.jpa.show-sql=true

spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:/liquibase/comfy/master.xml

# ============================================================================
# Security  --  JWT signing + CORS. Override the secret in every real
# environment (env var JWT_SECRET); the default below is for local dev only.
# HS256 requires a key of at least 32 bytes.
# ============================================================================
app.security.jwt.secret=${JWT_SECRET:local-dev-only-change-me-comfy-cash-close-secret-key-32b+}
app.security.jwt.expiration-hours=12
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.frontend.cash-close-review-path-template=${FRONTEND_CASH_CLOSE_REVIEW_PATH_TEMPLATE:/approvals?cashCloseId={id}}
app.frontend.cash-close-submitter-path-template=${FRONTEND_CASH_CLOSE_SUBMITTER_PATH_TEMPLATE:/history?cashCloseId={id}}

# ============================================================================
# Logging / tracing
# ============================================================================
logging.pattern.level=%5p [requestId:%X{requestId}]
logging.level.com.comfy.caseclose.controller=INFO
logging.level.com.comfy.caseclose.service.impl=INFO
logging.level.com.comfy.caseclose.logging=INFO

# ============================================================================
# Google Cloud Storage attachment storage  --  disabled by default (see
# GoogleCloudStorageProperties javadoc for setup steps, and for why this is
# GCS and not Drive: a service account has no personal Drive storage quota
# outside Google Workspace). Set app.storage.enabled=true and fill in the
# service account key path + bucket name once the credential is ready; no
# code changes needed.
# ============================================================================
    app.storage.enabled=${GCS_ENABLED:true}
# Relative paths are looked up from the working dir, then each parent dir (so the same value works
# from IntelliJ / spring-boot:run in the module dir and from the repo root). Override in deployed envs.
app.storage.service-account-key-path=${GCS_SERVICE_ACCOUNT_KEY:comfy-506206-1eb538c99f80.json}
app.storage.bucket-name=comfy-uploads
app.storage.object-prefix=${GCS_OBJECT_PREFIX:case-close}
app.storage.signed-url-ttl-minutes=${GCS_SIGNED_URL_TTL_MINUTES:60}
app.storage.max-file-size-bytes=10485760

# Orphan-attachment sweep (OrphanAttachmentCleanupJob) -- reclaims files uploaded to GCS that
# never ended up attached to a submitted cash close (form abandoned/refreshed before submit).
# No-op whenever app.storage.enabled is false, regardless of this flag.
app.storage.orphan-cleanup-enabled=${GCS_ORPHAN_CLEANUP_ENABLED:true}
app.storage.orphan-cleanup-min-age-hours=${GCS_ORPHAN_CLEANUP_MIN_AGE_HOURS:48}
app.storage.orphan-cleanup-cron=${GCS_ORPHAN_CLEANUP_CRON:0 0 3 * * *}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email delivery: smtp (default) or resend, using the same environment variable names as Vakot_BE.
# Missing provider credentials/from are reported as a delivery failure without breaking cash-close submission.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
