spring.application.name=comfy-case-close
# ============================================================================
# Datasource  --  fill these in later (or override via env vars before running)
# Defaults point at a local Postgres named 'comfy_cash_close'.
# ============================================================================
spring.datasource.url=jdbc:postgresql://localhost:6666/comfy_db
spring.datasource.username=comfy_db
spring.datasource.password=comfy_db
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# spring.jpa.show-sql=true

spring.liquibase.enabled=false

# ============================================================================
# Security  --  JWT signing + CORS. Override the secret in every real
# environment (env var JWT_SECRET); the default below is for local dev only.
# HS256 requires a key of at least 32 bytes.
# ============================================================================
app.security.jwt.secret=${JWT_SECRET:local-dev-only-change-me-comfy-cash-close-secret-key-32b+}
app.security.jwt.expiration-hours=12
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ============================================================================
# Google Drive attachment storage  --  disabled by default (see
# GoogleDriveProperties javadoc for setup steps). Set app.drive.enabled=true
# and fill in the service account key path + root folder id once the
# credential is ready; no code changes needed.
# ============================================================================
app.drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
app.drive.service-account-key-path=${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY:}
app.drive.root-folder-id=${GOOGLE_DRIVE_ROOT_FOLDER_ID:}
app.drive.application-name=Comfy Cash Close
app.drive.max-file-size-bytes=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB