# ============================================================================
# Defaults for the Liquibase CLI when it runs FROM THE HOST, from this directory
# (for example: liquibase status, liquibase history).
#
# The container in docker-compose.yml does NOT read this file; it gets its
# configuration from LIQUIBASE_* environment variables. There are two places, but
# changeLogFile MUST be the same in both: Liquibase records the path of every
# changelog file in DATABASECHANGELOG, so a different string makes it treat every
# changeset as new and rerun the lot, then fail on "relation already exists".
#
# url points at PostgreSQL DIRECTLY (5435), not at PgBouncer (6432): DDL and the
# Liquibase advisory lock need a stable session. If you moved the port with
# FNBX_PG_PORT, change it here too.
# ============================================================================
changeLogFile=changelog/master.xml
searchPath=.
url=jdbc:postgresql://localhost:5435/fnbx_oltp
username=fnbx_owner
password=fnbx_dev_password
driver=org.postgresql.Driver
liquibaseSchemaName=public
