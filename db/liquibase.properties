# ============================================================================
# Defaults cho Liquibase CLI chay TU MAY HOST (vd: liquibase status, history).
#
# Container trong docker-compose.yml KHONG doc file nay - no nhan cau hinh qua
# bien moi truong LIQUIBASE_*. Hai noi, nhung changeLogFile PHAI GIONG NHAU:
# Liquibase dung duong dan do lam khoa trong bang DATABASECHANGELOG.
# db.changelog-master.xml co logicalFilePath de khoa cung gia tri do lai, nen
# du chay tu host hay tu container thi van la cung mot changeset.
#
# url o day tro vao PostgreSQL TRUC TIEP (5433), khong qua PgBouncer (6432).
# ============================================================================
changeLogFile=changelog/db.changelog-master.xml
url=jdbc:postgresql://localhost:5433/fnbx_oltp
username=fnbx_owner
password=fnbx_dev_password
driver=org.postgresql.Driver
liquibaseSchemaName=public
